<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Seva Surfers İstanbul">
    <meta name="theme-color" content="#071324">
    <title>SEVA SURFERS — İstanbul 3D</title>
    <link rel="apple-touch-icon" id="dynamic-apple-icon" href="">
    <link rel="icon" id="dynamic-favicon" href="">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #071324;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ÜST HUD */
        #hud {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }
        .hud-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .hud-right {
            align-items: flex-end;
        }
        .hud-badge {
            background: rgba(7, 19, 36, 0.82);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(56, 189, 248, 0.28);
            color: #fff;
            padding: 8px 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }
        .coin-dot {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #fef08a, #f59e0b);
            border-radius: 50%;
            box-shadow: 0 0 10px #fbbf24;
            flex-shrink: 0;
        }
        .mult-pill {
            background: linear-gradient(135deg, #f97316, #e11d48);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 900;
        }
        #sound-toggle {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(7, 19, 36, 0.86);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 7px 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* AKTİF GÜÇLENDİRİCİLER */
        #powerup-hud {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 240px;
            pointer-events: none;
            z-index: 10;
        }
        .pu-card {
            background: rgba(7, 19, 36, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 6px 10px;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 800;
        }
        .pu-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .pu-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 4px;
            overflow: hidden;
        }
        .pu-fill {
            height: 100%;
            width: 100%;
        }

        /* EKRANLAR */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 19, 36, 0.86);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .hidden {
            display: none !important;
        }
        .logo-box {
            width: 82px;
            height: 82px;
            border-radius: 20px;
            margin-bottom: 10px;
            box-shadow: 0 10px 28px rgba(56, 189, 248, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.25);
        }
        .title-text {
            font-size: 2.9rem;
            font-weight: 950;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #38bdf8, #fbbf24, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .sub-text {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 18px;
            font-weight: 600;
        }
        .stats-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-main {
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 999px;
            font-size: 1.12rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.45);
            text-transform: uppercase;
        }
        .btn-sec {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            padding: 14px 26px;
            border-radius: 999px;
            font-size: 1.02rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* SUBWAY TARZI MAĞAZA */
        .shop-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #090d16;
            border-color: transparent;
        }
        .shop-grid {
            width: 100%;
            max-width: 720px;
            max-height: 55vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
            padding: 4px;
        }
        .item-card {
            background: rgba(15, 29, 51, 0.92);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .item-card.equipped {
            border-color: #38bdf8;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
        }
        .swatch {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.25);
        }
        .item-card h3 { font-size: 0.98rem; font-weight: 800; }
        .item-card p { font-size: 0.76rem; color: #94a3b8; min-height: 28px; }
        .action-btn {
            width: 100%;
            padding: 8px;
            border-radius: 10px;
            border: none;
            font-weight: 800;
            font-size: 0.84rem;
            cursor: pointer;
            background: #0284c7;
            color: #fff;
        }
        .action-btn.owned { background: #334155; }
        .action-btn.active { background: #10b981; color: #06281e; }
        .action-btn.box-btn { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; }

        .tip-foot {
            margin-top: 16px;
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-col">
                <div class="hud-badge">
                    <span>SKOR: <span id="score-val">0</span></span>
                    <span id="mult-badge" class="mult-pill">1x</span>
                </div>
                <div class="hud-badge" style="font-size: 0.85rem; padding: 5px 12px; color: #cbd5e1;">
                    REKOR: <span id="hud-best" style="color: #38bdf8;">0</span>
                </div>
            </div>
            <div class="hud-col hud-right">
                <div class="hud-badge">
                    <span class="coin-dot"></span>
                    <span id="coins-val">0</span>
                </div>
                <button id="sound-toggle">🔊 Ses Açık</button>
            </div>
        </div>

        <div id="powerup-hud"></div>

        <!-- ANA MENÜ -->
        <div id="start-screen" class="overlay">
            <img id="menu-logo" class="logo-box" alt="Seva Surfers İstanbul">
            <div class="title-text">SEVA SURFERS</div>
            <div class="sub-text">İstanbul Boğaz Hattı • Katmanlı 3D Karakter</div>
            <div class="stats-row">
                <div class="stat-box">🏆 Rekor: <span id="menu-best" style="color:#38bdf8;">0</span></div>
                <div class="stat-box"><span class="coin-dot"></span> Kasa: <span id="menu-bank" style="color:#fbbf24;">0</span></div>
            </div>
            <div class="btn-row">
                <button id="start-btn" class="btn-main">KOŞUYA BAŞLA</button>
                <button id="open-shop-btn" class="btn-sec">🛍️ MAĞAZA</button>
            </div>
            <div class="tip-foot">
                Ok Tuşları veya Kaydırma: Hareket • Çift Tık / Space: Kaykay Kalkanı
            </div>
        </div>

        <!-- SUBWAY TARZI MAĞAZA -->
        <div id="shop-screen" class="overlay hidden">
            <div class="title-text" style="font-size: 2.2rem;">SUBWAY MAĞAZA</div>
            <div class="stats-row" style="margin-bottom: 12px;">
                <div class="stat-box"><span class="coin-dot"></span> Altın: <span id="shop-bank" style="color:#fbbf24;">0</span></div>
            </div>
            <div class="shop-tabs">
                <button class="tab-btn active" data-tab="surfers">Karakterler</button>
                <button class="tab-btn" data-tab="boards">Kaykaylar</button>
                <button class="tab-btn" data-tab="boosts">Boost & Kutu</button>
            </div>
            <div class="shop-grid" id="shop-grid"></div>
            <button id="close-shop-btn" class="btn-sec">GERİ DÖN</button>
        </div>

        <!-- GAME OVER -->
        <div id="gameover-screen" class="overlay hidden">
            <div class="title-text" style="font-size: 2.5rem;">TUR BİTTİ!</div>
            <div class="sub-text" id="new-best-msg" style="color:#fbbf24; display:none;">⭐ YENİ İSTANBUL REKORU! ⭐</div>
            <div class="stats-row" style="flex-direction: column; min-width: 240px;">
                <div class="stat-box" style="justify-content: space-between;"><span>Skor:</span> <span id="final-score" style="color:#38bdf8;">0</span></div>
                <div class="stat-box" style="justify-content: space-between;"><span>Altın:</span> <span id="final-coins" style="color:#fbbf24;">0</span></div>
                <div class="stat-box" style="justify-content: space-between;"><span>Toplam Kasa:</span> <span id="final-bank" style="color:#10b981;">0</span></div>
            </div>
            <div class="btn-row">
                <button id="restart-btn" class="btn-main">Yeniden Başlat</button>
                <button id="go-shop-btn" class="btn-sec">🛍️ Mağaza</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. İKON ÜRETİCİ (IPHONE ANA EKRAN)
        // ==========================================
        function buildAppIcon() {
            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#071324"/>
                        <stop offset="65%" stop-color="#0f294a"/>
                        <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                </defs>
                <rect width="512" height="512" rx="112" fill="url(#sky)"/>
                <!-- Boğaz Köprüsü Silüeti -->
                <path d="M40 270 Q155 150 256 270 Q357 150 472 270" fill="none" stroke="#38bdf8" stroke-width="10"/>
                <line x1="155" y1="160" x2="155" y2="340" stroke="#e2e8f0" stroke-width="12"/>
                <line x1="357" y1="160" x2="357" y2="340" stroke="#e2e8f0" stroke-width="12"/>
                <!-- Ön Plan S & Gözlük -->
                <rect x="174" y="210" width="66" height="40" rx="8" fill="#090d16" stroke="#fbbf24" stroke-width="8"/>
                <rect x="272" y="210" width="66" height="40" rx="8" fill="#090d16" stroke="#fbbf24" stroke-width="8"/>
                <line x1="240" y1="228" x2="272" y2="228" stroke="#fbbf24" stroke-width="8"/>
                <text x="256" y="405" font-family="Arial, sans-serif" font-size="112" font-weight="900" fill="#ffffff" text-anchor="middle">SEVA</text>
            </svg>`;
            const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = 512; c.height = 512;
                c.getContext('2d').drawImage(img, 0, 0, 512, 512);
                const dataUrl = c.toDataURL('image/png');
                document.getElementById('dynamic-apple-icon').href = dataUrl;
                document.getElementById('dynamic-favicon').href = dataUrl;
                document.getElementById('menu-logo').src = dataUrl;
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
        buildAppIcon();

        // ==========================================
        // 1. SES MOTORU
        // ==========================================
        class SoundFX {
            constructor() { this.ctx = null; this.enabled = true; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            tone(freq, type, dur, vol = 0.14, slide = null) {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (slide) osc.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + dur);
            }
            swipe() { this.tone(330, 'sine', 0.1, 0.12, 540); }
            jump() { this.tone(270, 'triangle', 0.18, 0.16, 620); }
            roll() { this.tone(210, 'sawtooth', 0.15, 0.1, 95); }
            coin() {
                this.tone(988, 'sine', 0.08, 0.11);
                setTimeout(() => this.tone(1318, 'sine', 0.13, 0.11), 50);
            }
            powerup() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 'triangle', 0.14, 0.14), i * 55)); }
            crash() { this.tone(140, 'sawtooth', 0.4, 0.25, 38); }
        }
        const sfx = new SoundFX();

        // ==========================================
        // 2. SUBWAY MAĞAZA VERİLERİ & KAYIT
        // ==========================================
        const SURFERS = [
            { id: 'sevaastian', name: 'Sevaastian', desc: 'Siyah kombin & kemik gözlük', price: 0, main: '#111827', accent: '#38bdf8', glasses: true },
            { id: 'bosphorus_pro', name: 'Boğaz Runner', desc: 'Turkuaz-lacivert sahil stili', price: 150, main: '#0284c7', accent: '#fbbf24', glasses: true },
            { id: 'galata_red', name: 'Galata Red', desc: 'Kırmızı ceket & yüksek tempo', price: 320, main: '#dc2626', accent: '#f8fafc', glasses: false }
        ];

        const BOARDS = [
            { id: 'standard', name: 'Metro Board', desc: 'Standart kaykay (12sn kalkan)', price: 0, color: '#06b6d4', duration: 12 },
            { id: 'bogaz_wave', name: 'Boğaz Dalgası', desc: 'Geniş hız kaykayı (15sn kalkan)', price: 200, color: '#38bdf8', duration: 15 },
            { id: 'altin_star', name: 'Altın Yıldız', desc: 'VIP uzun kalkan (18sn kalkan)', price: 450, color: '#fbbf24', duration: 18 }
        ];

        let saveData = JSON.parse(localStorage.getItem('seva_istanbul_save')) || {
            bestScore: 0,
            bankCoins: 0,
            unlockedSurfers: ['sevaastian'],
            equippedSurfer: 'sevaastian',
            unlockedBoards: ['standard'],
            equippedBoard: 'standard',
            headstartCount: 1,
            scoreBoostCount: 1
        };

        function saveState() {
            localStorage.setItem('seva_istanbul_save', JSON.stringify(saveData));
            syncWalletUI();
        }

        // ==========================================
        // 3. THREE.JS SAHNE, İSTANBUL HARİTASI & KATMANLI KARAKTER
        // ==========================================
        const LANE_WIDTH = 3.3;
        const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];

        let scene, camera, renderer;
        let segments = [];
        let obstacles = [];
        let coins = [];
        let powerups = [];
        let particles = [];

        // Katmanlı 3D Karakter Düzlemleri (Back -> Mid -> Front Katmanlar)
        let playerRoot, layeredCharGroup, backLayerMesh, bodyLayerMesh, headLayerMesh, frontLayerMesh, boardPlaneMesh;
        let currentTab = 'surfers';

        let isRunning = false;
        let gameSpeed = 26;
        const maxSpeed = 66;
        let score = 0;
        let runCoins = 0;
        let scoreMult = 1;

        let currentLane = 1;
        let targetX = 0;
        let playerY = 0;
        let velocityY = 0;
        let isJumping = false;
        let isRolling = false;
        let rollTimer = 0;
        let animPhase = 0;

        let activePU = { magnet: 0, jetpack: 0, sneakers: 0, multiplier: 0, shield: 0 };
        let clock = new THREE.Clock();
        let spawnTimer = 0;

        // Dinamik Katmanlı Karakter Dokusu Üretici (CanvasTexture -> Katmanlı 3D Düzlemler)
        function createLayeredSurferTextures(surfer) {
            // 1. Arka Katman (Sırt Çantası / Gölge Katmanı)
            const backCanvas = document.createElement('canvas');
            backCanvas.width = 256; backCanvas.height = 256;
            const bctx = backCanvas.getContext('2d');
            bctx.fillStyle = '#0f172a';
            bctx.beginPath();
            bctx.roundRect(84, 88, 88, 92, 18);
            bctx.fill();
            bctx.strokeStyle = surfer.accent;
            bctx.lineWidth = 6;
            bctx.stroke();

            // 2. Gövde & Bacak Katmanı
            const bodyCanvas = document.createElement('canvas');
            bodyCanvas.width = 256; bodyCanvas.height = 256;
            const ctx = bodyCanvas.getContext('2d');
            ctx.fillStyle = surfer.main;
            ctx.beginPath();
            ctx.roundRect(78, 82, 100, 96, 16);
            ctx.fill();
            ctx.strokeStyle = surfer.accent;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(88, 125); ctx.lineTo(168, 125);
            ctx.stroke();

            // Bacaklar
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.roundRect(88, 174, 32, 64, 10);
            ctx.roundRect(136, 174, 32, 64, 10);
            ctx.fill();

            // 3. Baş & Kemik Gözlük Katmanı
            const headCanvas = document.createElement('canvas');
            headCanvas.width = 256; headCanvas.height = 256;
            const hctx = headCanvas.getContext('2d');
            hctx.fillStyle = '#fcd34d';
            hctx.beginPath();
            hctx.roundRect(84, 16, 88, 76, 20);
            hctx.fill();
            // Saç
            hctx.fillStyle = '#090d16';
            hctx.beginPath();
            hctx.roundRect(80, 10, 96, 28, 12);
            hctx.fill();
            // Kemik Gözlük
            if (surfer.glasses) {
                hctx.fillStyle = '#050811';
                hctx.fillRect(92, 42, 30, 20);
                hctx.fillRect(134, 42, 30, 20);
                hctx.fillRect(122, 49, 12, 6);
                hctx.fillStyle = surfer.accent;
                hctx.fillRect(97, 46, 20, 10);
                hctx.fillRect(139, 46, 20, 10);
            }

            // 4. Ön Katman (Ön Kol & Vurgu Şeridi)
            const frontCanvas = document.createElement('canvas');
            frontCanvas.width = 256; frontCanvas.height = 256;
            const fctx = frontCanvas.getContext('2d');
            fctx.fillStyle = surfer.accent;
            fctx.beginPath();
            fctx.roundRect(168, 96, 24, 72, 10);
            fctx.fill();

            return {
                back: new THREE.CanvasTexture(backCanvas),
                body: new THREE.CanvasTexture(bodyCanvas),
                head: new THREE.CanvasTexture(headCanvas),
                front: new THREE.CanvasTexture(frontCanvas)
            };
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x071324);
            scene.fog = new THREE.FogExp2(0x071324, 0.0105);

            camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 220);
            camera.position.set(0, 6.2, 10.8);
            camera.lookAt(0, 2, -12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('game-container').appendChild(renderer.domElement);

            const hemi = new THREE.HemisphereLight(0xbae6fd, 0x0f172a, 1.0);
            scene.add(hemi);
            const dir = new THREE.DirectionalLight(0xffffff, 0.95);
            dir.position.set(16, 32, 20);
            scene.add(dir);

            buildIstanbulTrack();
            buildLayeredCharacter();
            applyLoadout();
            syncWalletUI();
            renderShop();
            setupEvents();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            renderer.render(scene, camera);
        }

        // İSTANBUL HARİTASI: Boğaz Suyu, Sahil Hattı, Köprü Kemerleri & Kız Kulesi Silüeti
        function buildIstanbulTrack() {
            const segLen = 22;
            const count = 12;

            const roadGeo = new THREE.BoxGeometry(12.6, 0.6, segLen);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });

            // Sağ tarafta İstanbul Boğazı su şeridi
            const bosphorusGeo = new THREE.BoxGeometry(16, 0.4, segLen);
            const bosphorusMat = new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.25, metalness: 0.3 });

            // Sol tarafta İstanbul kıyı yapıları ve kule/köprü silüetleri
            const railGeo = new THREE.BoxGeometry(0.16, 0.14, segLen);
            const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.7 });

            for (let i = 0; i < count; i++) {
                const grp = new THREE.Group();
                grp.position.z = -i * segLen + 20;

                const road = new THREE.Mesh(roadGeo, roadMat);
                road.position.y = -0.3;
                grp.add(road);

                // Boğaz suyu (sağ taraf)
                const sea = new THREE.Mesh(bosphorusGeo, bosphorusMat);
                sea.position.set(14.5, -0.55, 0);
                grp.add(sea);

                // Kıyı korkuluğu
                const shoreBar = new THREE.Mesh(
                    new THREE.BoxGeometry(0.35, 1.1, segLen),
                    new THREE.MeshStandardMaterial({ color: 0xe2e8f0 })
                );
                shoreBar.position.set(6.5, 0.4, 0);
                grp.add(shoreBar);

                // 3 Şerit rayları
                LANES.forEach(lx => {
                    const r1 = new THREE.Mesh(railGeo, railMat); r1.position.set(lx - 0.72, 0.08, 0);
                    const r2 = new THREE.Mesh(railGeo, railMat); r2.position.set(lx + 0.72, 0.08, 0);
                    grp.add(r1, r2);
                });

                // Sol kıyı binaları ve belirli segmentlerde Kız Kulesi / Boğaz Kemeri
                const bH = 8 + ((i * 5) % 8);
                const bldg = new THREE.Mesh(
                    new THREE.BoxGeometry(4.2, bH, segLen - 1.5),
                    new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? 0x172554 : 0x1e293b })
                );
                bldg.position.set(-8.6, bH / 2 - 0.3, 0);
                grp.add(bldg);

                if (i % 4 === 2) {
                    // Boğaz hattında Kız Kulesi minyatür silüeti
                    const towerGrp = new THREE.Group();
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.3, 4.5, 12), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
                    base.position.y = 2.25;
                    const dome = new THREE.Mesh(new THREE.ConeGeometry(1.15, 2.0, 12), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
                    dome.position.y = 5.5;
                    towerGrp.add(base, dome);
                    towerGrp.position.set(9.8, -0.3, 0);
                    grp.add(towerGrp);
                }

                scene.add(grp);
                segments.push(grp);
            }
        }

        // KATMANLI 3D KARAKTER (Arka, Gövde, Baş, Ön Katman + Kaykay)
        function buildLayeredCharacter() {
            playerRoot = new THREE.Group();
            layeredCharGroup = new THREE.Group();
            playerRoot.add(layeredCharGroup);

            const planeGeo = new THREE.PlaneGeometry(2.1, 2.2);

            backLayerMesh = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.1, side: THREE.DoubleSide }));
            backLayerMesh.position.set(0, 1.15, 0.14);
            backLayerMesh.renderOrder = 1;

            bodyLayerMesh = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.1, side: THREE.DoubleSide }));
            bodyLayerMesh.position.set(0, 1.15, 0.04);
            bodyLayerMesh.renderOrder = 2;

            headLayerMesh = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.1, side: THREE.DoubleSide }));
            headLayerMesh.position.set(0, 1.32, -0.06);
            headLayerMesh.renderOrder = 3;

            frontLayerMesh = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.1, side: THREE.DoubleSide }));
            frontLayerMesh.position.set(0, 1.15, -0.14);
            frontLayerMesh.renderOrder = 4;

            boardPlaneMesh = new THREE.Mesh(
                new THREE.BoxGeometry(1.1, 0.15, 2.1),
                new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x0284c7, emissiveIntensity: 0.5 })
            );
            boardPlaneMesh.position.set(0, 0.08, 0);
            boardPlaneMesh.visible = false;
            playerRoot.add(boardPlaneMesh);

            layeredCharGroup.add(backLayerMesh, bodyLayerMesh, headLayerMesh, frontLayerMesh);
            scene.add(playerRoot);
        }

        function applyLoadout() {
            const surfer = SURFERS.find(s => s.id === saveData.equippedSurfer) || SURFERS[0];
            const board = BOARDS.find(b => b.id === saveData.equippedBoard) || BOARDS[0];
            const tex = createLayeredSurferTextures(surfer);

            backLayerMesh.material.map = tex.back; backLayerMesh.material.needsUpdate = true;
            bodyLayerMesh.material.map = tex.body; bodyLayerMesh.material.needsUpdate = true;
            headLayerMesh.material.map = tex.head; headLayerMesh.material.needsUpdate = true;
            frontLayerMesh.material.map = tex.front; frontLayerMesh.material.needsUpdate = true;

            boardPlaneMesh.material.color.set(board.color);
        }

        // ==========================================
        // 4. ENGELLER, ALTINLAR & GÜÇLENDİRİCİLER
        // ==========================================
        function spawnWave() {
            const zPos = -145;
            const order = [0, 1, 2].sort(() => Math.random() - 0.5);
            let trains = 0;

            order.forEach(idx => {
                const lx = LANES[idx];
                const r = Math.random();
                if (r < 0.34 && trains < 2) {
                    trains++;
                    const train = new THREE.Mesh(
                        new THREE.BoxGeometry(2.3, 3.2, 14),
                        new THREE.MeshStandardMaterial({ color: [0xef4444, 0x8b5cf6, 0x10b981][trains % 3] })
                    );
                    train.position.set(lx, 1.6, zPos - 7);
                    scene.add(train);
                    obstacles.push({ mesh: train, speedAdd: 10, box: { w: 2.0, minY: 0, maxY: 3.2, l: 14 } });
                } else if (r < 0.56) {
                    const bar = new THREE.Mesh(
                        new THREE.BoxGeometry(2.4, 1.15, 0.5),
                        new THREE.MeshStandardMaterial({ color: 0xf59e0b })
                    );
                    bar.position.set(lx, 0.58, zPos);
                    scene.add(bar);
                    obstacles.push({ mesh: bar, speedAdd: 0, box: { w: 2.1, minY: 0, maxY: 1.15, l: 0.5 } });
                    addCoin(lx, 2.35, zPos);
                } else if (r < 0.74) {
                    const high = new THREE.Mesh(
                        new THREE.BoxGeometry(2.5, 1.85, 0.5),
                        new THREE.MeshStandardMaterial({ color: 0xf43f5e })
                    );
                    high.position.set(lx, 2.1, zPos);
                    scene.add(high);
                    obstacles.push({ mesh: high, speedAdd: 0, box: { w: 2.1, minY: 1.18, maxY: 3.1, l: 0.5 } });
                    addCoin(lx, 0.65, zPos);
                } else {
                    for (let c = 0; c < 4; c++) addCoin(lx, 0.9, zPos - c * 3.2);
                    if (Math.random() < 0.2) addPowerup(lx, 1.1, zPos - 13);
                }
            });
        }

        function addCoin(x, y, z) {
            const c = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.4, 0.15, 14),
                new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xd97706, emissiveIntensity: 0.35 })
            );
            c.rotation.x = Math.PI / 2;
            c.position.set(x, y, z);
            scene.add(c);
            coins.push(c);
        }

        function addPowerup(x, y, z) {
            const list = [
                { key: 'magnet', color: 0xef4444, label: '🧲 Mıknatıs' },
                { key: 'jetpack', color: 0x38bdf8, label: '🚀 Jetpack' },
                { key: 'sneakers', color: 0x10b981, label: '👟 Süper Zıplama' },
                { key: 'multiplier', color: 0xa855f7, label: '⚡ 2x Skor' }
            ];
            const pick = list[Math.floor(Math.random() * list.length)];
            const m = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.55, 0),
                new THREE.MeshStandardMaterial({ color: pick.color, emissive: pick.color, emissiveIntensity: 0.5 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            powerups.push({ mesh: m, ...pick });
        }

        // ==========================================
        // 5. KONTROLLER & OYUN DÖNGÜSÜ
        // ==========================================
        function setupEvents() {
            let lastTap = 0;
            window.addEventListener('keydown', e => {
                if (!isRunning) return;
                if (e.key === 'ArrowLeft' || e.key === 'a') { if (currentLane > 0) { currentLane--; targetX = LANES[currentLane]; sfx.swipe(); } }
                else if (e.key === 'ArrowRight' || e.key === 'd') { if (currentLane < 2) { currentLane++; targetX = LANES[currentLane]; sfx.swipe(); } }
                else if (e.key === 'ArrowUp' || e.key === 'w') doJump();
                else if (e.key === 'ArrowDown' || e.key === 's') doRoll();
                else if (e.key === ' ') {
                    const now = Date.now();
                    if (now - lastTap < 300) activateBoard(); else doJump();
                    lastTap = now;
                }
            });

            let sx = 0, sy = 0, lastTouchTap = 0;
            window.addEventListener('touchstart', e => {
                if (e.touches[0]) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
            }, { passive: true });
            window.addEventListener('touchend', e => {
                if (!isRunning || !e.changedTouches[0]) return;
                const dx = e.changedTouches[0].clientX - sx;
                const dy = e.changedTouches[0].clientY - sy;
                if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
                    const now = Date.now();
                    if (now - lastTouchTap < 300) activateBoard();
                    lastTouchTap = now;
                    return;
                }
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (Math.abs(dx) > 26) {
                        if (dx > 0 && currentLane < 2) { currentLane++; targetX = LANES[currentLane]; sfx.swipe(); }
                        else if (dx < 0 && currentLane > 0) { currentLane--; targetX = LANES[currentLane]; sfx.swipe(); }
                    }
                } else {
                    if (Math.abs(dy) > 26) dy < 0 ? doJump() : doRoll();
                }
            }, { passive: true });

            document.getElementById('start-btn').onclick = startGame;
            document.getElementById('restart-btn').onclick = startGame;
            document.getElementById('open-shop-btn').onclick = () => openShop('gameover-screen');
            document.getElementById('go-shop-btn').onclick = () => openShop('gameover-screen');
            document.getElementById('close-shop-btn').onclick = () => {
                document.getElementById('shop-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            };
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTab = btn.dataset.tab;
                    renderShop();
                };
            });
            document.getElementById('sound-toggle').onclick = e => {
                sfx.enabled = !sfx.enabled;
                e.target.textContent = sfx.enabled ? '🔊 Ses Açık' : '🔇 Ses Kapalı';
            };
        }

        function openShop(hideId) {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById(hideId).classList.add('hidden');
            document.getElementById('shop-screen').classList.remove('hidden');
            renderShop();
        }

        function doJump() {
            if (!isJumping && activePU.jetpack <= 0) {
                isJumping = true;
                velocityY = activePU.sneakers > 0 ? 30 : 22;
                isRolling = false;
                layeredCharGroup.scale.set(1, 1, 1);
                sfx.jump();
            }
        }

        function doRoll() {
            if (activePU.jetpack > 0) return;
            if (isJumping) velocityY = -42;
            isRolling = true;
            rollTimer = 0.65;
            layeredCharGroup.scale.set(1.15, 0.48, 1);
            sfx.roll();
        }

        function activateBoard() {
            if (activePU.shield <= 0) {
                const board = BOARDS.find(b => b.id === saveData.equippedBoard) || BOARDS[0];
                activePU.shield = board.duration;
                boardPlaneMesh.visible = true;
                sfx.powerup();
            }
        }

        function startGame() {
            sfx.init();
            obstacles.forEach(o => scene.remove(o.mesh)); obstacles = [];
            coins.forEach(c => scene.remove(c)); coins = [];
            powerups.forEach(p => scene.remove(p.mesh)); powerups = [];

            applyLoadout();
            isRunning = true;
            gameSpeed = 26;
            score = 0;
            runCoins = 0;
            scoreMult = 1;
            currentLane = 1;
            targetX = 0;
            playerY = 0;
            velocityY = 0;
            isJumping = false;
            isRolling = false;
            layeredCharGroup.scale.set(1, 1, 1);
            activePU = { magnet: 0, jetpack: 0, sneakers: 0, multiplier: 0, shield: 0 };
            boardPlaneMesh.visible = false;
            playerRoot.position.set(0, 0, 0);

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('new-best-msg').style.display = 'none';

            clock.getDelta();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            isRunning = false;
            sfx.crash();
            const finalS = Math.floor(score);
            saveData.bankCoins += runCoins;
            if (finalS > saveData.bestScore) {
                saveData.bestScore = finalS;
                document.getElementById('new-best-msg').style.display = 'block';
            }
            saveState();
            document.getElementById('final-score').textContent = finalS;
            document.getElementById('final-coins').textContent = runCoins;
            document.getElementById('final-bank').textContent = saveData.bankCoins;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        function renderPUHud() {
            const el = document.getElementById('powerup-hud');
            el.innerHTML = '';
            const map = [
                { k: 'jetpack', label: '🚀 Jetpack', max: 8, col: '#38bdf8' },
                { k: 'magnet', label: '🧲 Mıknatıs', max: 12, col: '#ef4444' },
                { k: 'sneakers', label: '👟 Süper Zıplama', max: 12, col: '#10b981' },
                { k: 'multiplier', label: '⚡ 2x Skor', max: 12, col: '#a855f7' },
                { k: 'shield', label: '🛹 Kaykay', max: 18, col: '#f59e0b' }
            ];
            map.forEach(item => {
                if (activePU[item.k] > 0) {
                    const pct = Math.min(100, (activePU[item.k] / item.max) * 100);
                    el.innerHTML += `<div class="pu-card"><div class="pu-top"><span>${item.label}</span><span>${activePU[item.k].toFixed(1)}s</span></div><div class="pu-bar"><div class="pu-fill" style="width:${pct}%;background:${item.col}"></div></div></div>`;
                }
            });
        }

        function loop() {
            if (!isRunning) return;
            requestAnimationFrame(loop);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (gameSpeed < maxSpeed) gameSpeed += 0.65 * dt;
            const spd = activePU.jetpack > 0 ? gameSpeed * 1.4 : gameSpeed;

            Object.keys(activePU).forEach(k => { if (activePU[k] > 0) activePU[k] = Math.max(0, activePU[k] - dt); });
            boardPlaneMesh.visible = activePU.shield > 0;

            const mult = (activePU.multiplier > 0 ? 2 : 1) * scoreMult;
            score += spd * dt * 1.5 * mult;
            document.getElementById('score-val').textContent = Math.floor(score);
            document.getElementById('coins-val').textContent = runCoins;
            document.getElementById('mult-badge').textContent = mult + 'x';
            renderPUHud();

            const segLen = 22, totalL = segments.length * segLen;
            segments.forEach(s => { s.position.z += spd * dt; if (s.position.z > 30) s.position.z -= totalL; });

            playerRoot.position.x = THREE.MathUtils.lerp(playerRoot.position.x, targetX, 16 * dt);
            layeredCharGroup.rotation.z = (playerRoot.position.x - targetX) * 0.14;

            if (activePU.jetpack > 0) {
                playerY = THREE.MathUtils.lerp(playerY, 8.0, 6 * dt);
                isJumping = false;
            } else if (isJumping || playerY > 0) {
                isJumping = true;
                playerY += velocityY * dt;
                velocityY -= 60 * dt;
                if (playerY <= 0) { playerY = 0; velocityY = 0; isJumping = false; }
            }
            playerRoot.position.y = playerY;

            if (isRolling) {
                rollTimer -= dt;
                if (rollTimer <= 0) { isRolling = false; layeredCharGroup.scale.set(1, 1, 1); }
            } else if (!isJumping && activePU.jetpack <= 0) {
                animPhase += dt * spd * 0.65;
                // Katmanlı 3D derinlik/sekme animasyonu
                headLayerMesh.position.y = 1.32 + Math.abs(Math.sin(animPhase)) * 0.08;
                frontLayerMesh.position.z = -0.14 - Math.sin(animPhase) * 0.06;
                backLayerMesh.position.z = 0.14 + Math.sin(animPhase) * 0.06;
            }

            spawnTimer -= spd * dt;
            if (spawnTimer <= 0) { spawnWave(); spawnTimer = 31; }

            const pW = 0.8, pH = isRolling ? 0.85 : 1.75;
            const pMinX = playerRoot.position.x - pW / 2, pMaxX = playerRoot.position.x + pW / 2;
            const pMinY = playerY, pMaxY = playerY + pH;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.mesh.position.z += (spd + o.speedAdd) * dt;
                const pos = o.mesh.position, b = o.box;
                const hit = pMaxX > pos.x - b.w / 2 && pMinX < pos.x + b.w / 2 &&
                            pMaxY > b.minY && pMinY < b.maxY &&
                            0.45 > pos.z - b.l / 2 && -0.45 < pos.z + b.l / 2;
                if (hit) {
                    if (activePU.shield > 0) {
                        activePU.shield = 0; boardPlaneMesh.visible = false;
                        scene.remove(o.mesh); obstacles.splice(i, 1); sfx.crash(); continue;
                    }
                    gameOver(); return;
                }
                if (o.mesh.position.z - b.l / 2 > 18) { scene.remove(o.mesh); obstacles.splice(i, 1); }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.position.z += spd * dt;
                c.rotation.z += 4 * dt;
                if (activePU.magnet > 0 && c.position.z > -38 && c.position.z < 5) {
                    c.position.lerp(new THREE.Vector3(playerRoot.position.x, playerY + 1, 0), 12 * dt);
                }
                if (c.position.distanceTo(new THREE.Vector3(playerRoot.position.x, playerY + 0.9, 0)) < 1.35) {
                    scene.remove(c); coins.splice(i, 1); runCoins++; score += 50 * mult; sfx.coin(); continue;
                }
                if (c.position.z > 18) { scene.remove(c); coins.splice(i, 1); }
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.mesh.position.z += spd * dt;
                p.mesh.rotation.y += 3 * dt;
                if (p.mesh.position.distanceTo(new THREE.Vector3(playerRoot.position.x, playerY + 0.9, 0)) < 1.5) {
                    activePU[p.key] = p.key === 'jetpack' ? 8 : 12;
                    scene.remove(p.mesh); powerups.splice(i, 1); sfx.powerup(); continue;
                }
                if (p.mesh.position.z > 18) { scene.remove(p.mesh); powerups.splice(i, 1); }
            }

            camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerRoot.position.x * 0.45, 8 * dt);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, 6.2 + playerY * 0.4, 8 * dt);
            renderer.render(scene, camera);
        }

        // ==========================================
        // 6. SUBWAY MAĞAZA RENDER
        // ==========================================
        function syncWalletUI() {
            document.getElementById('menu-best').textContent = saveData.bestScore;
            document.getElementById('hud-best').textContent = saveData.bestScore;
            document.getElementById('menu-bank').textContent = saveData.bankCoins;
            document.getElementById('shop-bank').textContent = saveData.bankCoins;
        }

        function renderShop() {
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';

            if (currentTab === 'surfers') {
                SURFERS.forEach(s => {
                    const owned = saveData.unlockedSurfers.includes(s.id);
                    const eq = saveData.equippedSurfer === s.id;
                    const card = document.createElement('div');
                    card.className = 'item-card' + (eq ? ' equipped' : '');
                    card.innerHTML = `<div class="swatch" style="background:linear-gradient(135deg,${s.main} 65%,${s.accent})"></div><h3>${s.name}</h3><p>${s.desc}</p><button class="action-btn ${eq ? 'active' : owned ? 'owned' : ''}">${eq ? '✓ Seçili' : owned ? 'Kuşan' : '🪙 ' + s.price}</button>`;
                    card.querySelector('button').onclick = () => {
                        if (eq) return;
                        if (owned) { saveData.equippedSurfer = s.id; applyLoadout(); saveState(); renderShop(); sfx.swipe(); }
                        else if (saveData.bankCoins >= s.price) {
                            saveData.bankCoins -= s.price; saveData.unlockedSurfers.push(s.id); saveData.equippedSurfer = s.id;
                            applyLoadout(); saveState(); renderShop(); sfx.powerup();
                        } else sfx.crash();
                    };
                    grid.appendChild(card);
                });
            } else if (currentTab === 'boards') {
                BOARDS.forEach(b => {
                    const owned = saveData.unlockedBoards.includes(b.id);
                    const eq = saveData.equippedBoard === b.id;
                    const card = document.createElement('div');
                    card.className = 'item-card' + (eq ? ' equipped' : '');
                    card.innerHTML = `<div class="swatch" style="background:${b.color}"></div><h3>${b.name}</h3><p>${b.desc}</p><button class="action-btn ${eq ? 'active' : owned ? 'owned' : ''}">${eq ? '✓ Seçili' : owned ? 'Kuşan' : '🪙 ' + b.price}</button>`;
                    card.querySelector('button').onclick = () => {
                        if (eq) return;
                        if (owned) { saveData.equippedBoard = b.id; applyLoadout(); saveState(); renderShop(); sfx.swipe(); }
                        else if (saveData.bankCoins >= b.price) {
                            saveData.bankCoins -= b.price; saveData.unlockedBoards.push(b.id); saveData.equippedBoard = b.id;
                            applyLoadout(); saveState(); renderShop(); sfx.powerup();
                        } else sfx.crash();
                    };
                    grid.appendChild(card);
                });
            } else {
                // Mystery Box
                const boxCard = document.createElement('div');
                boxCard.className = 'item-card';
                boxCard.innerHTML = `<div class="swatch" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"></div><h3>Mystery Box</h3><p>Rastgele 40–220 altın kazandırır</p><button class="action-btn box-btn">🎁 Aç (🪙 80)</button>`;
                boxCard.querySelector('button').onclick = () => {
                    if (saveData.bankCoins < 80) { sfx.crash(); return; }
                    saveData.bankCoins -= 80;
                    const prize = [40, 60, 100, 150, 220][Math.floor(Math.random() * 5)];
                    saveData.bankCoins += prize;
                    saveState(); renderShop(); sfx.powerup();
                    alert(`🎁 Mystery Box içinden ${prize} altın çıktı!`);
                };
                grid.appendChild(boxCard);

                // Kalıcı Skor Çarpanı
                const multCard = document.createElement('div');
                multCard.className = 'item-card';
                multCard.innerHTML = `<div class="swatch" style="background:linear-gradient(135deg,#a855f7,#38bdf8)"></div><h3>Kalıcı Çarpan (+1x)</h3><p>Mevcut çarpan: ${scoreMult}x</p><button class="action-btn">⬆️ Yükselt (🪙 250)</button>`;
                multCard.querySelector('button').onclick = () => {
                    if (saveData.bankCoins >= 250) {
                        saveData.bankCoins -= 250; scoreMult++; saveState(); renderShop(); sfx.powerup();
                    } else sfx.crash();
                };
                grid.appendChild(multCard);
            }
        }

        init();
    </script>
</body>
</html>
